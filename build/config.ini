# Config file for the build system
# Project root is automatically inferred

[project]
exec_name = IgnisEditor
name      = Ignis Editor
run_dir   = editor
run_args  =

[build]
generator     = gmake
configuration = Debug
verbose       = false
dev           = true
bin_dir       = bin
obj_dir       = bin-int

[premake]
dir        = premake
exec       = premake/premake5
file       = premake5.lua
version    = 5.0.0-beta8
plugin_dir = premake/plugins

[plugin.export-compile-commands]
url  = https://github.com/tarruda/premake-export-compile-commands
type = premake

[plugin.vscode]
type           = python
makefile_tools = true